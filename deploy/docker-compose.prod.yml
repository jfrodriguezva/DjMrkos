# Production stack for a plain VPS: SQL Server + a one-shot schema migrator + the API +
# Caddy (serves the built frontend and reverse-proxies /api and /hubs to the API, same
# domain — see frontend/Caddyfile). Run from the repo root:
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# See deploy/README.md for the full VPS setup walkthrough and deploy/.env.example for the
# variables this file expects.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - djmrkos-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` mapping on purpose — only the api/migrator containers on the internal
    # Docker network can reach it, never the host or the internet.

  migrator:
    build:
      context: ../backend
      dockerfile: src/DjMrkos.Migrator/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    command: ["Server=sqlserver,1433;Database=djmrkos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"]
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: src/DjMrkos.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Server=sqlserver,1433;Database=djmrkos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Qr__SigningKey: ${QR_SIGNING_KEY}
      Admin__ApiKey: ${ADMIN_API_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      Frontend__PublicBaseUrl: https://${DOMAIN}
      Frontend__AllowedOrigins__0: https://${DOMAIN}
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  djmrkos-sqlserver-data:
  caddy-data:
  caddy-config:
