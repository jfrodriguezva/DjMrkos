services:
  postgres:
    image: postgres:16-alpine
    container_name: djmrkos-postgres
    environment:
      POSTGRES_DB: djmrkos
      POSTGRES_USER: djmrkos
      POSTGRES_PASSWORD: djmrkos_dev
    ports:
      - "5432:5432"
    volumes:
      - djmrkos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djmrkos -d djmrkos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  djmrkos-postgres-data:
