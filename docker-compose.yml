services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: djmrkos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: djmrkos_dev_P@ss1
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - djmrkos-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  djmrkos-sqlserver-data:
